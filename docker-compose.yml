version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: xenocrm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - xenocrm-network

  backend:
    build: ./backend
    container_name: xenocrm-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/xenocrm
      - CHANNEL_SERVICE_URL=http://channel-service:6000
      - CRM_CALLBACK_URL=http://backend:5000/api/receipt
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    networks:
      - xenocrm-network

  channel-service:
    build: ./channel-service
    container_name: xenocrm-channel-service
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - CRM_BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - xenocrm-network

  frontend:
    build: ./frontend
    container_name: xenocrm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - xenocrm-network

volumes:
  mongo-data:

networks:
  xenocrm-network:
    driver: bridge
